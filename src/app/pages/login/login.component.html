  <div class="flex align-items-center justify-content-center w-screen h-screen">
    <div style="width: 40%; height: 100vh;">
      <form [formGroup]="formGroup">
        <div class="flex align-items-center justify-content-center h-screen " >
            <div class="surface-card p-5 shadow-2 border-round w-full lg:w-6" >
                <h3 class="text-center pb-4">REGISTRO DE GASTOS</h3>

                <div class="flex flex-column pb-3">
                    <label for="username" class="mb-2 font-medium">Usuário</label>
                    <input pInputText id="username" type="text" formControlName="email"  class="w-full" />
                </div>

                <div class="flex flex-column pb-4">
                    <label for="password" class="mb-2 font-medium">Senha</label>
                    <input pInputText id="password" type="password" formControlName="senha" class="w-full" />
                </div>

                <p-button label="Login" icon="pi pi-user" (click)="showDashboard()" styleClass="w-full"></p-button>
            </div>
          </div>
      </form>

    </div>
    <div class="fundo_login" style="width: 60%; height: 100vh;">

    </div>

  </div>
