<div class="container mt-4">
 <span class="m-5"> <h2>Gerenciamento de Usuários</h2></span>
  <div class="flex flex-wrap gap-3 m-3 ">
    <p-button label="Novo Usuário" [raised]="true" (click)="showDialogUser()" />
  </div>


  <!-- Tabela de Listagem -->
  <div class="card p-3 shadow-sm">
    <div class="card" style="margin-top: 2rem; padding: 1rem;">
    <p-table
    [value]="usuarios"
    [tableStyle]="{ 'min-width': '50rem' }"
    [paginator]="true"
    [rows]="5"
    [rowsPerPageOptions]="[5, 10, 20]">
        <ng-template pTemplate="header">
            <tr>
                <th>codigo</th>
                <th>Name</th>
                <th>email</th>
                <th>Ações</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-user>
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.nome }}</td>
                <td>{{ user.email }}</td>
                <td>
                  <button icon="pi pi-pencil" [rounded]="true" [text]="true" size="small"  pButton type="button" class="p-button-secondary" (click)="editar(user)"></button>
                  <button icon="pi pi-trash" [rounded]="true" size="small" [text]="true" pButton type="button" class="p-button-secondary" (click)="deletar(user.id)"></button>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
  </div>
</div>

<div class="card flex justify-content-center">
  <p-dialog header="Cadastrar Usuário" [modal]="true" [(visible)]="dialogUserVisible" [style]="{ width: '25rem' }">

     <!-- Formulário -->
  <form [formGroup]="usuarioForm" (ngSubmit)="salvar()" class="card p-3 mb-4 shadow-sm">
    <div class="flex flex-column mb-3">
      <label for="nome">Nome</label>
      <input type="text" pInputText formControlName="nome"/>
    </div>

    <div class="flex flex-column mb-3">
      <label for="email">E-mail</label>
      <input type="email" pInputText formControlName="email"/>
    </div>

    <div class="flex flex-column mb-3">
      <label for="senha">Senhas</label>
      <input type="password" pInputText formControlName="senha"/>
    </div>

    <footer>
      <div class="flex justify-content-center p-3 m-3 gap-2">
         <p-button label="Salvar" [raised]="true" />
          <p-button label="Cancelar" [raised]="true" severity="secondary" />
      </div>
    </footer>

  </form>

    </p-dialog>
</div>
