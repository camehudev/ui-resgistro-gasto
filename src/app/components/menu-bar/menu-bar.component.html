<div class="flex" style="background-color: rgb(254, 254, 254); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);">
  <div class="flex align-items-center justify-content-center md:justify-content-start pt-2 px-3">
    <img src="../../../assets/logo.png" class="back_logo" alt="Logo do Sistema"/>
  </div>
  <div class="menu">
     <p-menubar [model]="items" [style]="{'border': 'none'}" />
     <div class="flex">
          <p-button (onClick)="op.toggle($event)" icon="pi pi-user" [rounded]="true" size="small"  />
          <p-overlayPanel class="p-overlaypanel p-overlaypanel-content" #op>
                <div class="flex flex-column" >
                  <span style="cursor: pointer;">
                      <i class="pi pi-user" style="color: rgb(144, 143, 143)"></i>
                    &nbsp;Perfil</span>
                  <p-divider type="solid" />
                  <span style="cursor: pointer;">
                    <i class="pi pi-cog" style="color: rgb(144, 143, 143)"></i>
                    &nbsp; Configurações</span>
                  <p-divider type="solid" class="mb-3" />
                  <span (click)="fazerLogout()" style="cursor: pointer;">
                    <i class="pi pi-sign-out" style="color: rgb(144, 143, 143)"></i>
                    &nbsp;Sair
                  </span>
                </div>

          </p-overlayPanel>
      </div>
  </div>
</div>
}
