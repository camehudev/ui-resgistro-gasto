<div class="card" style="margin-top: 2rem; padding: 1rem;">
    <p-table
    [value]="gastosRegistrados"
    [tableStyle]="{ 'width': '90dvw' }"
    [paginator]="true"
    [rows]="5"
    [rowsPerPageOptions]="[5, 10, 20]">
        <ng-template pTemplate="header">
            <tr>
                <th>Code</th>
                <th>Name</th>
                <th>Category</th>
                <th>Quantity</th>
                <th>Date</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-product>
            <tr>
                <td>{{ product.id }}</td>
                <td>{{ product.categoria }}</td>
                <td>{{ product.valor }}</td>
                <td>{{ product.descricao }}</td>
                <td>{{ product.data }}</td>
            </tr>
        </ng-template>
    </p-table>
</div>
