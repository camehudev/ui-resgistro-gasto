<div class="app-layout">
  <!-- O uso do async pipe gerencia o ciclo reativo sem conflitos de change detection -->
  <ng-container >
    <app-menu-bar></app-menu-bar>
  </ng-container>

  <main class="content-area">
    <router-outlet></router-outlet>
  </main>
</div>

<!-- Spinner Global Overlay controlando pela propriedade limpa do componente -->
@if (isLoading) {
  <div class="spinner-overlay">
    <div class="spinner"></div>
    <p>Carregando dados financeiros...</p>
  </div>
}
